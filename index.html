
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111b">
  <title>Compliment Downloader</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="card">
      <p class="eyebrow">A little boost for your day</p>
      <h1>Compliment Downloader</h1>
      <p class="intro">Get a random compliment. Keep it. You deserve it.</p>

      <div class="compliment-box" aria-live="polite">
        <p id="compliment">Your next compliment is one click away.</p>
      </div>

      <button id="download-button" type="button">
        Download Compliment
      </button>

      <p id="status" class="status" role="status">
        Ready when you are.
      </p>

      <p class="footer">
        100,000 reasons to give yourself a little credit.
      </p>
    </section>
  </main>
</body>
</html>
